<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="impactShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>

  <rect x="8" y="8" width="464" height="464" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" filter="url(#cardShadow)"/>
  <g transform="translate(240 300)">
    <g id="asset-techbro-deadpan_classic" class="stick-figure" data-gender="male" data-expression="deadpan_classic" data-pose="default" transform="translate(0, 3.0015999256791646) rotate(0) scale(0.95)" opacity="1">
      <!-- Floor Drop Shadow -->
      <ellipse cx="0" cy="215.1010907860176" rx="65" ry="14" fill="#111111" opacity="0.16"/>

      <!-- Legs (Back to Front) -->
      <g id="legs" stroke="#111111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="0" y1="55" x2="-39.905082836800695" y2="130.0505453930088"/>
        <line x1="-39.905082836800695" y1="130.0505453930088" x2="-79.81016567360139" y2="205.1010907860176"/>

        <line x1="0" y1="55" x2="39.90508283680072" y2="130.0505453930088"/>
        <line x1="39.90508283680072" y1="130.0505453930088" x2="79.81016567360145" y2="205.1010907860176"/>
      </g>

      <!-- Spine & Torso with arms -->
      <g id="torso" transform="rotate(-1.0595234934310993 0 55)">
        <line x1="0" y1="-120" x2="0" y2="55" stroke="#111111" stroke-width="8" stroke-linecap="round"/>

        
        <!-- Light Blue Button-Up Shirt Base -->
        <path d="M -34 -90 L 34 -90 L 38 12 L -38 12 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
        <line x1="0" y1="-90" x2="0" y2="12" stroke="#bae6fd" stroke-width="3"/>
        <!-- Navy Fleece Vest Overlay -->
        <path d="M -34 -90 L -12 -90 L -8 12 L -38 12 Z" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
        <path d="M 34 -90 L 12 -90 L 8 12 L 38 12 Z" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
        <!-- Zipper Track -->
        <line x1="0" y1="-75" x2="0" y2="12" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 2"/>
        <!-- Patagonia-style Logo Patch -->
        <rect x="-28" y="-60" width="12" height="6" rx="1" fill="#f97316"/>
      

        <!-- Left Arm with 2-finger V hand -->
        <g id="left-arm" class="arms" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <line x1="0" y1="-95" x2="-73.18134471636112" y2="-49.260327069027404"/>
          <line x1="-73.18134471636112" y1="-49.260327069027404" x2="-111.6569359564131" y2="18.589719937061226"/>
          <!-- 2-finger open V hand -->
          <line x1="-111.6569359564131" y1="18.589719937061226" x2="-133.6569359564131" y2="6.589719937061226"/>
          <line x1="-111.6569359564131" y1="18.589719937061226" x2="-129.6569359564131" y2="38.589719937061226"/>
          
        </g>

        <!-- Right Arm with 2-finger V hand -->
        <g id="right-arm" class="arms" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <line x1="0" y1="-95" x2="79.44703100972168" y2="-59.48789102383873"/>
          <line x1="79.44703100972168" y1="-59.48789102383873" x2="141.05135216510212" y2="-11.645361669876394"/>
          <!-- 2-finger open V hand -->
          <line x1="141.05135216510212" y1="-11.645361669876394" x2="163.05135216510212" y2="-25.645361669876394"/>
          <line x1="141.05135216510212" y1="-11.645361669876394" x2="161.05135216510212" y2="6.354638330123606"/>
          
        </g>

        <!-- HEAD GROUP (Crisp Casually Explained / Alex Meyers proportions) -->
        <g id="head" transform="translate(0, -120) rotate(-1.3477105715709856) scale(0.72)">
          
          <!-- 1. Back Hair Layer (Flows behind head and shoulders) -->
          
          <!-- Clean Tapered Neck Line -->
          <path d="M -65 0 C -75 -45 -35 -95 0 -95 C 35 -95 75 -45 65 0 Z" fill="#1e1b18" stroke="#0a0908" stroke-width="5"/>
        

          <!-- 2. Warm Creamy Peach Head Skin (tilted egg/oval shape) -->
          <path id="head-skin" d="
            M -68 15
            C -82 -40 -68 -80 -18 -85
            C 38 -87 76 -50 78 15
            C 78 68 48 88 5 88
            C -40 88 -68 70 -68 15 Z"
            fill="#fed89b" stroke="#111111" stroke-width="8" stroke-linejoin="round"/>

          <!-- Nose/Cheek Tick Mark (from reference image) -->
          <path d="M -12 8 L -10 20" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round"/>

          <!-- 3. Facial Features -->
          <g id="face">
            
    <path d="M -45 -48 Q -25 -62 -5 -48" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <path d="M 22 -44 Q 42 -58 62 -44" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
  
            
      <line x1="-36" y1="-16" x2="-12" y2="-16" stroke="#111" stroke-width="7" stroke-linecap="round"/>
      <line x1="26" y1="-14" x2="50" y2="-14" stroke="#111" stroke-width="7" stroke-linecap="round"/>
    
            
            
      <g id="mouth" transform="translate(0, 32) rotate(4)">
        <line x1="-28" y1="0" x2="22" y2="0" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
      </g>
    
          </g>

          <!-- 4. Front Hair Layer (Bangs, Strands, Clips sit in front of Face) -->
          
          <!-- Crisp Tech Side Part & Combed Fringe (Above y=-45) -->
          <path d="
            M -55 -48
            C -40 -60 -15 -62 10 -60
            C 35 -58 55 -48 60 -40
            L 55 -34
            C 30 -44 -20 -44 -48 -36 Z"
            fill="#292524" stroke="#0c0a09" stroke-width="3"/>
          <path d="M -30 -55 Q 0 -60 30 -52" fill="none" stroke="#44403c" stroke-width="3" stroke-linecap="round"/>
        
        </g>
      </g>
    </g>
  </g>
</svg>