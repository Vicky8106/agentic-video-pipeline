<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" width="480" height="540">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="impactShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
<g id="PROP-CAM" transform="translate(240, 270) rotate(0) scale(0.85)">
        <rect x="-80" y="-45" width="160" height="90" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="6" filter="url(#cardShadow)"/>
        <!-- Top Flash Bracket & Red Dial -->
        <rect x="-30" y="-70" width="60" height="25" rx="4" fill="#334155"/>
        <circle cx="50" cy="-35" r="8" fill="#dc2626"/>
        <!-- Long Telephoto Lens -->
        <polygon points="-80,-35 -160,-45 -160,45 -80,35" fill="#0f172a" stroke="#334155" stroke-width="4"/>
        <ellipse cx="-160" cy="0" rx="10" ry="45" fill="#38bdf8" opacity="0.8"/>
        <!-- Handgrip -->
        <rect x="50" y="-40" width="30" height="80" rx="6" fill="#0f172a"/>
      </g>
</svg>