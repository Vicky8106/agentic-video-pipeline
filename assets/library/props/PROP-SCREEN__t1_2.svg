        <polygon points="-120,-75 -80,-75 -100,-40 -120,-40" fill="#ffffff"/>
        <polygon points="-40,-75 0,-75 -20,-40 -60,-40" fill="#ffffff"/>
        <polygon points="40,-75 80,-75 60,-40 20,-40" fill="#ffffff"/>
