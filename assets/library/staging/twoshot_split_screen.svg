        <!-- Full-Bleed Studio Stage Background -->
        <rect x="-4000" y="-4000" width="10000" height="10000" fill="#fbfaf7"/>
        <rect x="-4000" y="740" width="10000" height="4000" fill="#edf0ea"/>
