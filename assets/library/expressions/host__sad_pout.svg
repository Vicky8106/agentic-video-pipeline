<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="impactShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>

  <rect x="8" y="8" width="464" height="464" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" filter="url(#cardShadow)"/>
  <g transform="translate(240 300)">
    <g id="asset-host-sad_pout" class="stick-figure" data-gender="male" data-expression="sad_pout" data-pose="facepalm" transform="translate(0, 3.0015999256791646) rotate(0) scale(0.95)" opacity="1">
      <!-- Floor Drop Shadow -->
      <ellipse cx="0" cy="215.1010907860176" rx="65" ry="14" fill="#111111" opacity="0.16"/>

      <!-- Legs (Back to Front) -->
      <g id="legs" stroke="#111111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="0" y1="55" x2="-39.905082836800695" y2="130.0505453930088"/>
        <line x1="-39.905082836800695" y1="130.0505453930088" x2="-79.81016567360139" y2="205.1010907860176"/>

        <line x1="0" y1="55" x2="39.90508283680072" y2="130.0505453930088"/>
        <line x1="39.90508283680072" y1="130.0505453930088" x2="79.81016567360145" y2="205.1010907860176"/>
      </g>

      <!-- Spine & Torso with arms -->
      <g id="torso" transform="rotate(-1.0595234934310993 0 55)">
        <line x1="0" y1="-120" x2="0" y2="55" stroke="#111111" stroke-width="8" stroke-linecap="round"/>

        

        <!-- Left Arm with 2-finger V hand -->
        <g id="left-arm" class="arms" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <line x1="0" y1="-95" x2="-79.49748800807518" y2="-59.58673750460928"/>
          <line x1="-79.49748800807518" y1="-59.58673750460928" x2="-132.6917155381175" y2="-2.539615250440434"/>
          <!-- 2-finger open V hand -->
          <line x1="-132.6917155381175" y1="-2.539615250440434" x2="-154.6917155381175" y2="-14.539615250440434"/>
          <line x1="-132.6917155381175" y1="-2.539615250440434" x2="-150.6917155381175" y2="17.460384749559566"/>
          
        </g>

        <!-- Right Arm with 2-finger V hand -->
        <g id="right-arm" class="arms" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <line x1="0" y1="-95" x2="27.655135216676193" y2="-170.97562899036032"/>
          <line x1="27.655135216676193" y1="-170.97562899036032" x2="66.65513521667623" y2="-103.42564749517412"/>
          <!-- 2-finger open V hand -->
          <line x1="66.65513521667623" y1="-103.42564749517412" x2="88.65513521667623" y2="-117.42564749517412"/>
          <line x1="66.65513521667623" y1="-103.42564749517412" x2="86.65513521667623" y2="-85.42564749517412"/>
          
        </g>

        <!-- HEAD GROUP (Crisp Casually Explained / Alex Meyers proportions) -->
        <g id="head" transform="translate(0, -120) rotate(-0.26555912089726164) scale(0.72)">
          
      <g transform="translate(75, -80)">
        <path d="M 0 -20 C 15 -10 15 15 0 20 C -15 15 -15 -10 0 -20 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="3" filter="url(#glow)"/>
      </g>
    
          <!-- 1. Back Hair Layer (Flows behind head and shoulders) -->
          
          <!-- Iconic Host Classic Curly Mop -->
          <path id="hair-back" d="
            M -75 25
            C -115 15 -125 -45 -85 -70
            C -115 -115 -60 -160 -15 -152
            C 15 -185 85 -175 105 -130
            C 145 -110 160 -45 130 -5
            C 160 45 135 110 90 95
            C 80 55 75 25 65 -5
            L -65 0 Z"
            fill="#0d0d0d" stroke="#0d0d0d" stroke-width="6" stroke-linejoin="round"/>
        

          <!-- 2. Warm Creamy Peach Head Skin (tilted egg/oval shape) -->
          <path id="head-skin" d="
            M -68 15
            C -82 -40 -68 -80 -18 -85
            C 38 -87 76 -50 78 15
            C 78 68 48 88 5 88
            C -40 88 -68 70 -68 15 Z"
            fill="#fed89b" stroke="#111111" stroke-width="8" stroke-linejoin="round"/>

          <!-- Nose/Cheek Tick Mark (from reference image) -->
          <path d="M -12 8 L -10 20" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round"/>

          <!-- 3. Facial Features -->
          <g id="face">
            
    <path d="M -45 -48 Q -25 -62 -5 -48" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <path d="M 22 -44 Q 42 -58 62 -44" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
  
            
      <ellipse cx="-24" cy="-16" rx="21" ry="25" fill="#ffffff" stroke="#111111" stroke-width="6"/>
      <circle cx="-20" cy="-14" r="6" fill="#111"/>
      <ellipse cx="38" cy="-14" rx="17" ry="26" fill="#ffffff" stroke="#111111" stroke-width="6"/>
      <circle cx="42" cy="-12" r="5" fill="#111"/>
      <!-- Flowing Tears -->
      <path d="M -24 -2 Q -35 25 -28 55" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M 38 0 Q 48 25 42 55" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    
            
            
      <g id="mouth" transform="translate(0, 32)">
        <path d="M -25 -10 L 25 -10 L 20 85 C 0 95 -10 95 -20 85 Z" fill="#2b0a0a" stroke="#111111" stroke-width="6"/>
        <rect x="-18" y="-8" width="36" height="12" rx="3" fill="#ffffff"/>
        <!-- Long floppy tongue -->
        <path d="M -12 40 Q 0 90 25 75 Q 10 50 12 40 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
      </g>
    
          </g>

          <!-- 4. Front Hair Layer (Bangs, Strands, Clips sit in front of Face) -->
          
          <!-- Front Forehead Curl Tufts (High on forehead above brows y=-65..-45) -->
          <path d="M -45 -50 C -35 -65 -15 -65 -5 -50 C 5 -65 30 -65 40 -50" fill="none" stroke="#0d0d0d" stroke-width="5" stroke-linecap="round"/>
        
        </g>
      </g>
    </g>
  </g>
</svg>