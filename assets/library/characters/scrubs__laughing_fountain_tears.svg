    <path d="M -45 -48 Q -25 -62 -5 -48" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <path d="M 22 -44 Q 42 -58 62 -44" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
  
            
      <path d="M -44 -34 Q -28 -44 -12 -36" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="-24" cy="-16" rx="21" ry="25" fill="#ffffff" stroke="#111111" stroke-width="6"/>
      <path d="M -17.471468395622704 -36.957450672180514 C -5.471468395622703 -36.957450672180514 0.5285316043772967 -24.957450672180517 -5.471468395622703 -6.957450672180516 C -11.471468395622704 7.042549327819484 -23.471468395622704 5.042549327819484 -23.471468395622704 -8.957450672180515 C -23.471468395622704 -24.957450672180517 -23.471468395622704 -36.957450672180514 -17.471468395622704 -36.957450672180514 Z" fill="#111111"/>
      <ellipse cx="38" cy="-14" rx="17" ry="26" fill="#ffffff" stroke="#111111" stroke-width="6"/>
      <path d="M 44.5285316043773 -34.957450672180514 C 56.5285316043773 -34.957450672180514 60.5285316043773 -22.957450672180517 56.5285316043773 -4.957450672180516 C 51.5285316043773 9.042549327819485 41.5285316043773 7.042549327819484 41.5285316043773 -6.957450672180516 C 41.5285316043773 -22.957450672180517 40.5285316043773 -34.957450672180514 44.5285316043773 -34.957450672180514 Z" fill="#111111"/>
    
            
            
      <g id="mouth" transform="translate(0, 32) rotate(4)">
        <path d="M -30 -13 L 24 -11 L 18 13 L -28 11 Z" fill="#ffffff" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>
        
