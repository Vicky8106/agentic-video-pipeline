        <!-- Left Arm with 2-finger V hand -->
        <g id="left-arm" class="arms" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <line x1="0" y1="-95" x2="-39.246876275915994" y2="-167.30919877927886"/>
          <line x1="-39.246876275915994" y1="-167.30919877927886" x2="38.45631017524016" y2="-174.1073467135962"/>
