<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" width="480" height="540">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="impactShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
<g id="PROP-PEND" transform="translate(240, 270) rotate(0) scale(0.85)">
        <g transform="rotate(4.939200282095353)">
          <!-- Pivot Mount -->
          <circle cx="0" cy="0" r="22" fill="#eab308" stroke="#ca8a04" stroke-width="6"/>
          <!-- Long Brass Arm -->
          <line x1="0" y1="0" x2="0" y2="340" stroke="#ca8a04" stroke-width="12"/>
          <!-- Giant Pendulum Bob Gauge -->
          <g transform="translate(0, 340)">
            <circle cx="0" cy="0" r="70" fill="#eab308" stroke="#854d0e" stroke-width="8" filter="url(#cardShadow)"/>
            <circle cx="0" cy="0" r="50" fill="#fef08a"/>
            <!-- Gauge Labels -->
            <text x="0" y="-15" font-family="'Impact', sans-serif" font-size="16" fill="#854d0e" text-anchor="middle">BODY ERA</text>
            <text x="0" y="15" font-family="'Impact', sans-serif" font-size="20" fill="#dc2626" text-anchor="middle">
              OZEMPIC
            </text>
          </g>
        </g>
      </g>
</svg>