<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" width="480" height="540">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="impactShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
<g id="PROP-SURGERY" transform="translate(240, 270) rotate(0) scale(0.85)">
        <rect x="-120" y="-60" width="240" height="120" rx="12" fill="#cbd5e1" stroke="#475569" stroke-width="5" filter="url(#cardShadow)"/>
        <!-- Scalpel & Scissors -->
        <line x1="-70" y1="-20" x2="40" y2="-20" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
        <polygon points="40,-20 80,-30 65,-20" fill="#94a3b8"/>
        <line x1="-60" y1="20" x2="60" y2="20" stroke="#0f172a" stroke-width="5"/>
      </g>
