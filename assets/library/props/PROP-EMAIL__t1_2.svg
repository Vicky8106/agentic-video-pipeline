<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" width="480" height="540">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="impactShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
<g id="PROP-EMAIL" transform="translate(240, 270) rotate(0) scale(0.85)">
        <rect x="-110" y="-70" width="220" height="140" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="6" filter="url(#cardShadow)"/>
        <!-- Flap Lines -->
        <polyline points="-110,-70 0,15 110,-70" fill="none" stroke="#0f172a" stroke-width="5"/>
        <!-- Red Wax Seal -->
        <circle cx="0" cy="15" r="18" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
        <text x="0" y="20" font-family="'Impact', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">VIP</text>
      </g>
</svg>