        <g id="right-arm" class="arms" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <line x1="0" y1="-95" x2="39.24687627591602" y2="-167.30919877927886"/>
          <line x1="39.24687627591602" y1="-167.30919877927886" x2="-38.456310175240134" y2="-174.10734671359623"/>
