<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" width="480" height="540">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="impactShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
<g id="PROP-BELL" transform="translate(240, 270) rotate(0) scale(0.85)">
        <!-- Handle -->
        <line x1="0" y1="40" x2="80" y2="-60" stroke="#78350f" stroke-width="12" stroke-linecap="round"/>
        <!-- Gavel Head -->
        <g transform="translate(80, -60) rotate(-45)">
          <rect x="-25" y="-45" width="50" height="90" rx="8" fill="#451a03" stroke="#1c0a00" stroke-width="5" filter="url(#cardShadow)"/>
          <line x1="-25" y1="0" x2="25" y2="0" stroke="#ca8a04" stroke-width="6"/> <!-- Gold band -->
        </g>
      </g>
</svg>