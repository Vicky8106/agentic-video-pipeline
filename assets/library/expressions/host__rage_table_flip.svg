  </defs>

  <rect x="8" y="8" width="464" height="464" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" filter="url(#cardShadow)"/>
  <g transform="translate(240 300)">
    <g id="asset-host-rage_table_flip" class="stick-figure" data-gender="male" data-expression="rage_table_flip" data-pose="mind_blown" transform="translate(0, 3.0015999256791646) rotate(0) scale(0.95)" opacity="1">
      <!-- Floor Drop Shadow -->
      <ellipse cx="0" cy="215.1010907860176" rx="65" ry="14" fill="#111111" opacity="0.16"/>

