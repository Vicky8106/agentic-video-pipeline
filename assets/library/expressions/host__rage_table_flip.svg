      <g id="legs" stroke="#111111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="0" y1="55" x2="-39.905082836800695" y2="130.0505453930088"/>
        <line x1="-39.905082836800695" y1="130.0505453930088" x2="-79.81016567360139" y2="205.1010907860176"/>

        <line x1="0" y1="55" x2="39.90508283680072" y2="130.0505453930088"/>
        <line x1="39.90508283680072" y1="130.0505453930088" x2="79.81016567360145" y2="205.1010907860176"/>
      </g>

