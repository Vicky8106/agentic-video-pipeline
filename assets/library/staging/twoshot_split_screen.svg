    <g id="stage-host" class="stick-figure" data-gender="male" data-expression="deadpan_classic" data-pose="default" transform="translate(450, 563.0015999256792) rotate(0) scale(0.72)" opacity="1">
      <!-- Floor Drop Shadow -->
