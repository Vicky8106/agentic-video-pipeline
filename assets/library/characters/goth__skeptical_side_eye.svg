<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="impactShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>

  <rect x="8" y="8" width="464" height="464" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" filter="url(#cardShadow)"/>
  <g transform="translate(240 300)">
    <g id="asset-goth-skeptical_side_eye" class="stick-figure" data-gender="female" data-expression="skeptical_side_eye" data-pose="crossed_arms" transform="translate(0, 3.0015999256791646) rotate(0) scale(0.95)" opacity="1">
      <!-- Floor Drop Shadow -->
      <ellipse cx="0" cy="215.1010907860176" rx="65" ry="14" fill="#111111" opacity="0.16"/>

      <!-- Legs (Back to Front) -->
      <g id="legs" stroke="#111111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="0" y1="55" x2="-39.905082836800695" y2="130.0505453930088"/>
        <line x1="-39.905082836800695" y1="130.0505453930088" x2="-79.81016567360139" y2="205.1010907860176"/>

        <line x1="0" y1="55" x2="39.90508283680072" y2="130.0505453930088"/>
        <line x1="39.90508283680072" y1="130.0505453930088" x2="79.81016567360145" y2="205.1010907860176"/>
      </g>

      <!-- Spine & Torso with arms -->
      <g id="torso" transform="rotate(-1.0595234934310993 0 55)">
        <line x1="0" y1="-120" x2="0" y2="55" stroke="#111111" stroke-width="8" stroke-linecap="round"/>

        
        <!-- Glamour Red Carpet Evening Gown -->
        <path d="M -30 -85 L 30 -85 L 42 15 L 65 140 C 20 155 -20 155 -65 140 L -42 15 Z"
              fill="#be123c" stroke="#881337" stroke-width="5" stroke-linejoin="round"/>
        <!-- Sweetheart Neckline & Gold Belt -->
        <path d="M -30 -85 Q 0 -60 30 -85" fill="none" stroke="#fff1f2" stroke-width="3"/>
        <rect x="-32" y="5" width="64" height="8" rx="2" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
        <circle cx="0" cy="9" r="6" fill="#facc15"/>
      

        <!-- Left Arm with 2-finger V hand -->
        <g id="left-arm" class="arms" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <line x1="0" y1="-95" x2="-39.65425056074767" y2="-22.856910076706612"/>
          <line x1="-39.65425056074767" y1="-22.856910076706612" x2="38.26202144282475" y2="-26.470019134750267"/>
          <!-- 2-finger open V hand -->
          <line x1="38.26202144282475" y1="-26.470019134750267" x2="16.262021442824746" y2="-38.47001913475027"/>
          <line x1="38.26202144282475" y1="-26.470019134750267" x2="20.262021442824746" y2="-6.470019134750267"/>
          
        </g>

        <!-- Right Arm with 2-finger V hand -->
        <g id="right-arm" class="arms" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <line x1="0" y1="-95" x2="39.654250560747684" y2="-22.856910076706612"/>
          <line x1="39.654250560747684" y1="-22.856910076706612" x2="-38.26202144282473" y2="-26.470019134750252"/>
          <!-- 2-finger open V hand -->
          <line x1="-38.26202144282473" y1="-26.470019134750252" x2="-16.262021442824732" y2="-40.47001913475025"/>
          <line x1="-38.26202144282473" y1="-26.470019134750252" x2="-18.262021442824732" y2="-8.470019134750252"/>
          
        </g>

        <!-- HEAD GROUP (Crisp Casually Explained / Alex Meyers proportions) -->
        <g id="head" transform="translate(0, -120) rotate(8.652289428429015) scale(0.72)">
          
      <g transform="translate(85, -110)">
        <text x="0" y="0" font-family="'Impact', sans-serif" font-size="36" fill="#f43f5e" filter="url(#glow)">?</text>
        <text x="25" y="-20" font-family="'Impact', sans-serif" font-size="28" fill="#ec4899">?</text>
      </g>
    
          <!-- 1. Back Hair Layer (Flows behind head and shoulders) -->
          
          <!-- Heavy Dramatic Gothic Black Waves -->
          <path d="
            M -90 10
            C -130 -40 -100 -130 0 -130
            C 100 -130 130 -40 90 10
            C 125 80 130 170 95 225
            C 75 170 65 110 50 60
            L -50 60
            C -65 110 -75 170 -95 225
            C -130 170 -125 80 -90 10 Z"
            fill="#09090b" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
        

          <!-- 2. Warm Creamy Peach Head Skin (tilted egg/oval shape) -->
          <path id="head-skin" d="
            M -68 15
            C -82 -40 -68 -80 -18 -85
            C 38 -87 76 -50 78 15
            C 78 68 48 88 5 88
            C -40 88 -68 70 -68 15 Z"
            fill="#fed89b" stroke="#111111" stroke-width="8" stroke-linejoin="round"/>

          <!-- Nose/Cheek Tick Mark (from reference image) -->
          <path d="M -12 8 L -10 20" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round"/>

          <!-- 3. Facial Features -->
          <g id="face">
            
    <path d="M -45 -62 Q -25 -76 -5 -62" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <path d="M 22 -44 Q 42 -58 62 -44" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
  
            
      <path d="M -44 -34 Q -28 -44 -12 -36" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="-24" cy="-16" rx="21" ry="25" fill="#ffffff" stroke="#111111" stroke-width="6"/>
      <path d="M -17.471468395622704 -36.957450672180514 C -5.471468395622703 -36.957450672180514 0.5285316043772967 -24.957450672180517 -5.471468395622703 -6.957450672180516 C -11.471468395622704 7.042549327819484 -23.471468395622704 5.042549327819484 -23.471468395622704 -8.957450672180515 C -23.471468395622704 -24.957450672180517 -23.471468395622704 -36.957450672180514 -17.471468395622704 -36.957450672180514 Z" fill="#111111"/>
      <ellipse cx="38" cy="-14" rx="17" ry="26" fill="#ffffff" stroke="#111111" stroke-width="6"/>
      <path d="M 44.5285316043773 -34.957450672180514 C 56.5285316043773 -34.957450672180514 60.5285316043773 -22.957450672180517 56.5285316043773 -4.957450672180516 C 51.5285316043773 9.042549327819485 41.5285316043773 7.042549327819484 41.5285316043773 -6.957450672180516 C 41.5285316043773 -22.957450672180517 40.5285316043773 -34.957450672180514 44.5285316043773 -34.957450672180514 Z" fill="#111111"/>
    
            
      <path d="M -44 -28 L -52 -36 M -36 -34 L -40 -44 M -20 -36 L -20 -46" stroke="#111" stroke-width="4" stroke-linecap="round"/>
      <path d="M 44 -26 L 52 -34 M 36 -32 L 40 -42 M 20 -34 L 20 -44" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    
      <ellipse cx="-48" cy="18" rx="14" ry="8" fill="#fb7185" opacity="0.6"/>
      <ellipse cx="48" cy="18" rx="14" ry="8" fill="#fb7185" opacity="0.6"/>
    
            
      <g id="mouth" transform="translate(0, 32) rotate(4)">
        <line x1="-28" y1="0" x2="22" y2="0" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
      </g>
    
          </g>

          <!-- 4. Front Hair Layer (Bangs, Strands, Clips sit in front of Face) -->
          
          <!-- Gothic Center Part with Ornate Velvet Rose -->
          <g>
            <path d="M -55 -48 Q -25 -60 0 -55 Q 25 -60 55 -48" fill="none" stroke="#18181b" stroke-width="6" stroke-linecap="round"/>
            <!-- Dark Red Velvet Gothic Rose Pin on Side -->
            <g transform="translate(52, -55)">
              <circle cx="0" cy="0" r="14" fill="#881337" stroke="#4c0519" stroke-width="3"/>
              <path d="M -6 -4 Q 0 -12 6 -4 Q 10 4 0 8 Q -10 4 -6 -4 Z" fill="#9f1239"/>
              <circle cx="0" cy="0" r="4" fill="#be123c"/>
            </g>
          </g>
        
        </g>
      </g>
    </g>
  </g>
</svg>